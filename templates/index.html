<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心率联动遥控 · 摄像头终端</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         background: #0f1115; color: #e8eaed; max-width: 760px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { color: #9aa0a6; font-size: 13px; margin-bottom: 16px; }
  .warn { background: #4a2c17; border: 1px solid #a4652a; color: #ffc46b;
          padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; }
  .hidden { display: none !important; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; }
  button { background: #1a73e8; color: #fff; border: 0; padding: 10px 16px; border-radius: 8px;
           font-size: 14px; cursor: pointer; }
  button:disabled { background: #3c4043; cursor: not-allowed; }
  button.gray { background: #3c4043; }
  label { font-size: 13px; color: #9aa0a6; }
  input[type=number] { width: 70px; padding: 6px; border-radius: 6px; border: 1px solid #5f6368;
                       background: #202124; color: #e8eaed; font-size: 14px; }
  video { width: 100%; border-radius: 12px; background: #000; margin-bottom: 12px; }
  .status { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 8px; font-size: 13px; margin-bottom: 12px; }
  .status div { background: #202124; border-radius: 8px; padding: 8px 10px; }
  .status b { display: block; margin-top: 2px; color: #fff; font-weight: 600; }
  .ok { color: #81c995; } .bad { color: #f28b82; }
  .ai-panel { background: #0b0e12; border: 1px solid #2a2f36; border-radius: 10px;
              padding: 12px; margin-bottom: 12px; }
  .ai-panel h3 { font-size: 14px; color: #9aa0a6; margin-bottom: 10px; }
  .narr { background: #13171d; border-left: 3px solid #2f81f7; border-radius: 6px;
          padding: 8px 10px; margin-bottom: 8px; }
  .narr-h { font-size: 12px; color: #7ab8e8; margin-bottom: 4px; font-weight: 600; }
  .narr pre { white-space: pre-wrap; word-break: break-word; font-size: 13px;
              font-family: ui-monospace, Consolas, monospace; color: #e8eaed; margin: 0; }
  .ai-log { max-height: 220px; overflow-y: auto; }
  .ai-log::-webkit-scrollbar { width: 6px; }
  .ai-log::-webkit-scrollbar-thumb { background: #3c4043; border-radius: 3px; }
  .op-empty { color: #9aa0a6; font-size: 13px; padding: 8px; }
  .op-item { display: flex; gap: 8px; align-items: baseline; padding: 6px 4px;
             border-bottom: 1px solid #1c2026; font-size: 12.5px; }
  .op-ts { color: #7a8087; font-family: ui-monospace, Consolas, monospace; flex-shrink: 0; }
  .op-ic { flex-shrink: 0; }
  .op-act { color: #e8eaed; font-weight: 600; flex-shrink: 0; }
  .op-det { color: #9aa0a6; word-break: break-word; }

  /* 事件弹窗样式 */
  #event-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.8);
    z-index: 999;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #event-panel {
    background: #202124;
    border-radius: 12px;
    padding: 20px;
    max-width: 500px;
    width: 90%;
    text-align: center;
  }
  #event-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; color: #fff; }
  #event-desc { font-size: 14px; color: #9aa0a6; margin-bottom: 8px; }
  #event-risk { font-size: 12px; color: #f28b82; margin-bottom: 16px; }
  #event-timer { font-size: 18px; font-weight: 700; color: #1a73e8; margin-bottom: 16px; }
  #event-options { display: flex; flex-direction: column; gap: 10px; }
  #event-options button {
    padding: 14px 20px;
    font-size: 16px;
    border-radius: 8px;
    background: #1a73e8;
    color: #fff;
    border: 0;
    cursor: pointer;
  }
  #event-options button:active {
    background: #1557b0;
  }
</style>
</head>
<body>
  <h1>📷 摄像头终端</h1>
  <div class="sub">每 3 秒拍照上传，AI 根据画面和心率输出控制指令</div>

  <div id="secure-hint" class="warn hidden">
    ⚠️ 当前为 http 非安全环境，浏览器禁止调用摄像头。请用 https 访问。
  </div>

  <div class="row">
    <button id="btn-start">启动摄像头</button>
    <button id="btn-stop" disabled>停止</button>
    <button id="btn-switch" class="gray">切换前后摄像头</button>
    <label>间隔(秒)<input id="interval" type="number" min="1" max="30" value="3"></label>
    <label><input type="checkbox" id="tts-enabled"> AI语音朗读</label>
  </div>

  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas" hidden></canvas>

  <div class="status">
    <div>上传状态 <b id="up-status">未开始</b></div>
    <div>上次上传 <b id="up-time">-</b></div>
    <div>服务器串口 <b id="srv-status">-</b></div>
    <div>心率 <b id="hr">-</b></div>
    <div>熔断提示 <b id="fuse">-</b></div>
    <div>最后指令 <b id="cmd">-</b></div>
  </div>

  <!-- 手动控制面板 -->
  <div class="manual-panel" style="background:#202124;border-radius:8px;padding:10px;margin-bottom:12px;">
    <h3 style="font-size:14px;color:#9aa0a6;margin-bottom:8px;">🎛️ 手动控制</h3>
    <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;">
      <label>强度 <input type="range" id="manual-level" min="0" max="100" value="30"> <span id="manual-level-val">30</span></label>
      <label>时长(秒) <input type="range" id="manual-duration" min="1" max="60" value="10"> <span id="manual-duration-val">10</span></label>
      <label>波形
        <select id="manual-wave">
          <option value="constant">constant</option>
          <option value="sine">sine</option>
          <option value="pulse">pulse</option>
          <option value="random">random</option>
        </select>
      </label>
      <button id="btn-manual-set">发送 SET</button>
      <button id="btn-manual-stop">发送 STOP</button>
    </div>
  </div>

  <!-- 自定义角色面板 -->
  <div class="custom-role-panel" style="background:#202124;border-radius:8px;padding:10px;margin-bottom:12px;">
    <h3 style="font-size:14px;color:#9aa0a6;margin-bottom:8px;">🎭 自定义角色</h3>
    <button id="btn-toggle-role">编辑角色设定</button>
    <div id="role-editor" class="hidden" style="margin-top:8px;">
      <textarea id="custom-role-text" rows="6" style="width:100%;background:#0f1115;color:#e8eaed;border:1px solid #5f6368;border-radius:6px;padding:6px;" placeholder="在此粘贴你的 SYSTEM_PROMPT，留空并保存可恢复默认角色"></textarea>
      <div style="margin-top:6px;display:flex;gap:8px;">
        <button id="btn-save-role">保存角色</button>
        <button id="btn-reset-role">恢复默认</button>
      </div>
    </div>
  </div>

  <div class="ai-panel">
    <h3>🤖 AI 叙述 与 操作日志</h3>
    <div class="narr"><div class="narr-h">🧠 AI 思考·叙述</div><pre id="ai-narr">(等待 AI 分析…)</pre></div>
    <div class="narr"><div class="narr-h">📖 AI 回复·剧情</div><pre id="ai-reply">-</pre></div>
    <div class="narr-h" style="margin:4px 0 6px;">🎮 操作日志</div>
    <div class="ai-log" id="op-log"><div class="op-empty">(等待 AI 开始运行，请点「启动摄像头」…)</div></div>
  </div>

  <!-- 事件弹窗 -->
  <div id="event-overlay" class="hidden">
    <div id="event-panel">
      <div id="event-title"></div>
      <div id="event-desc"></div>
      <div id="event-risk"></div>
      <div id="event-timer"></div>
      <div id="event-options"></div>
    </div>
  </div>

<script>
(function () {
  var video = document.getElementById('video');
  var canvas = document.getElementById('canvas');
  var intervalInput = document.getElementById('interval');
  var upStatus = document.getElementById('up-status');
  var upTime = document.getElementById('up-time');
  var srvStatus = document.getElementById('srv-status');
  var hrEl = document.getElementById('hr');
  var fuseEl = document.getElementById('fuse');
  var cmdEl = document.getElementById('cmd');
  var aiNarr = document.getElementById('ai-narr');
  var aiReply = document.getElementById('ai-reply');
  var opLogEl = document.getElementById('op-log');
  var btnStart = document.getElementById('btn-start');
  var btnStop = document.getElementById('btn-stop');
  var btnSwitch = document.getElementById('btn-switch');

  var stream = null, facing = 'environment', timer = null, uploading = false;
  var lastOpKey = '';
  var iconMap = { image:'📷', cmd:'🎮', fuse:'⚠️', warn:'⚠️' };

  // ====== 音频相关变量 ======
  var audioContext = null;
  var analyser = null;
  var dataArray = null;
  var mediaRecorder = null;
  var recordedChunks = [];
  var lastVolume = 0;

  // ====== TTS 语音朗读变量 ======
  var ttsEnabled = false;
  var lastAiText = '';
  var audioPlayer = new Audio();

  // ====== 认证 key 支持 ======
  var accessKey = new URLSearchParams(window.location.search).get('key') || '';

  function withKey(url) {
    if (!accessKey) return url;
    var separator = url.indexOf('?') !== -1 ? '&' : '?';
    return url + separator + 'key=' + encodeURIComponent(accessKey);
  }

  if (location.protocol !== 'https:' &&
      location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
    document.getElementById('secure-hint').classList.remove('hidden');
  }

  function setStatus(t) { upStatus.textContent = t; }
  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; });
  }
  function renderOpLog(list) {
    if (!list || !list.length) { return; }
    var key = list.map(function(o){ return o.ts + o.action; }).join('|');
    if (key === lastOpKey) { return; }
    lastOpKey = key;
    var h = '';
    for (var i = list.length - 1; i >= 0; i--) {
      var o = list[i];
      var icon = iconMap[o.evt] || '•';
      var ts = new Date(o.ts * 1000).toLocaleTimeString();
      h += '<div class="op-item"><span class="op-ts">' + ts + '</span><span class="op-ic">' + icon + '</span>'
         + '<span class="op-act">' + escapeHtml(o.action) + '</span><span class="op-det">' + escapeHtml(o.detail || '') + '</span></div>';
    }
    opLogEl.innerHTML = h;
  }

  // ====== 音频特征提取 ======
  function initAudioCapture(stream) {
    try {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioContext.createAnalyser();
      analyser.fftSize = 512;
      var source = audioContext.createMediaStreamSource(stream);
      source.connect(analyser);
      dataArray = new Uint8Array(analyser.frequencyBinCount);
    } catch (e) { console.warn('音频初始化失败:', e); }
  }

  function getAudioFeatures() {
    if (!analyser) return null;
    try {
      analyser.getByteTimeDomainData(dataArray);
      var sum = 0;
      for (var i = 0; i < dataArray.length; i++) {
        var val = (dataArray[i] - 128) / 128;
        sum += val * val;
      }
      var rms = Math.sqrt(sum / dataArray.length);
      var volume = Math.min(100, rms * 100);
      var zeroCrossings = 0;
      for (i = 1; i < dataArray.length; i++) {
        if ((dataArray[i] - 128) * (dataArray[i-1] - 128) < 0) zeroCrossings++;
      }
      var pitch = zeroCrossings / dataArray.length;
      return { volume: volume, pitch: pitch };
    } catch (e) { return null; }
  }

  function uploadAudioFeatures() {
    var features = getAudioFeatures();
    if (!features) return;
    var volumeChange = Math.abs(features.volume - lastVolume);
    lastVolume = features.volume;
    fetch(withKey('/upload_audio_features'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        volume: features.volume,
        pitch: features.pitch,
        volumeChange: volumeChange,
        timestamp: Date.now()
      })
    }).catch(function(e){ console.warn('音频特征上传失败:', e); });
  }

  // ====== 录音并上传 ======
  function startRecorder(stream) {
    try {
      mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
      mediaRecorder.ondataavailable = function(event) {
        if (event.data.size > 0) recordedChunks.push(event.data);
      };
      mediaRecorder.onstop = function() {
        if (recordedChunks.length === 0) return;
        var blob = new Blob(recordedChunks, { type: 'audio/webm' });
        recordedChunks = [];
        var fd = new FormData();
        fd.append('audio', blob, 'audio.webm');
        fetch(withKey('/upload_audio'), { method: 'POST', body: fd })
          .then(function(res){ return res.json(); })
          .then(function(data){
            if (data.text) console.log('[语音] 识别结果:', data.text);
          })
          .catch(function(e){ console.warn('音频上传失败:', e); });
      };
    } catch (e) { console.warn('录音初始化失败:', e); }
  }

  function recordAndUploadAudio() {
    if (!mediaRecorder || mediaRecorder.state === 'recording') return;
    recordedChunks = [];
    mediaRecorder.start();
    setTimeout(function(){
      if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
    }, 2000);
  }

  async function startCamera() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: true
      });
      video.srcObject = stream;
      await video.play();
      btnStart.disabled = true; btnStop.disabled = false;
      setStatus('摄像头已启动');

      initAudioCapture(stream);
      startRecorder(stream);

      scheduleUpload();
    } catch (e) {
      setStatus('摄像头错误: ' + e.message);
      alert('无法访问摄像头: ' + e.message + (location.protocol === 'http:' ? ' (请改用 https)' : ''));
    }
  }

  function stopCamera() {
    if (timer) { clearInterval(timer); timer = null; }
    if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
    video.srcObject = null;
    btnStart.disabled = false; btnStop.disabled = true;
    setStatus('已停止');
    if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
    if (audioContext) audioContext.close();
  }

  function scheduleUpload() {
    if (timer) clearInterval(timer);
    timer = setInterval(function(){
      uploadOnce();
      uploadAudioFeatures();
      recordAndUploadAudio();
    }, Number(intervalInput.value || 3) * 1000);
  }

  function capture() {
    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;
    canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
    return new Promise(function (resolve) { canvas.toBlob(resolve, 'image/jpeg', 0.85); });
  }

  async function uploadOnce() {
    if (uploading) return;
    uploading = true;
    try {
      var blob = await capture();
      var fd = new FormData();
      fd.append('image', blob, 'frame.jpg');
      var resp = await fetch(withKey('/upload'), { method: 'POST', body: fd });
      var j = await resp.json();
      upTime.textContent = new Date().toLocaleTimeString();
      setStatus(j.ok ? '上传中…' : '上传失败: ' + (j.error || resp.status));
    } catch (e) { setStatus('上传错误: ' + e.message); }
    finally { uploading = false; }
  }

  btnStart.addEventListener('click', startCamera);
  btnStop.addEventListener('click', stopCamera);
  btnSwitch.addEventListener('click', function () {
    facing = (facing === 'environment') ? 'user' : 'environment';
    stopCamera();
    setTimeout(startCamera, 300);
  });
  intervalInput.addEventListener('change', function () { if (timer) scheduleUpload(); });

  // ====== 手动控制逻辑 ======
  var manualLevel = document.getElementById('manual-level');
  var manualDuration = document.getElementById('manual-duration');
  var manualWave = document.getElementById('manual-wave');
  var manualLevelVal = document.getElementById('manual-level-val');
  var manualDurationVal = document.getElementById('manual-duration-val');
  var btnManualSet = document.getElementById('btn-manual-set');
  var btnManualStop = document.getElementById('btn-manual-stop');

  manualLevel.addEventListener('input', function() { manualLevelVal.textContent = manualLevel.value; });
  manualDuration.addEventListener('input', function() { manualDurationVal.textContent = manualDuration.value; });
  btnManualSet.addEventListener('click', function() {
    var cmd = 'SET ' + manualLevel.value + ' ' + manualDuration.value + ' ' + manualWave.value;
    sendManualCommand(cmd);
  });
  btnManualStop.addEventListener('click', function() { sendManualCommand('STOP'); });

  async function sendManualCommand(cmd) {
    try {
      const resp = await fetch(withKey('/api/command'), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ cmd: cmd })
      });
      const j = await resp.json();
      if (j.ok) {
        console.log('手动命令已发送:', cmd);
      } else {
        alert('命令发送失败: ' + (j.error || resp.status));
      }
    } catch (e) {
      console.warn('手动命令异常:', e);
      alert('网络错误，命令发送失败');
    }
  }

  // ====== 事件弹窗逻辑 ======
  var eventTimerInterval = null;
  var eventTimeoutSeconds = 15;
  var activeEventId = null;

  function showEvent(evt) {
    activeEventId = evt.id;
    document.getElementById('event-title').textContent = evt.title;
    document.getElementById('event-desc').textContent = evt.description;
    document.getElementById('event-risk').textContent = evt.risk_reward || '';
    var optsDiv = document.getElementById('event-options');
    optsDiv.innerHTML = '';
    evt.options.forEach(function(opt) {
      var btn = document.createElement('button');
      btn.textContent = opt.text;
      btn.onclick = function() { chooseEventOption(opt.text); };
      optsDiv.appendChild(btn);
    });
    document.getElementById('event-overlay').classList.remove('hidden');

    var remaining = eventTimeoutSeconds;
    document.getElementById('event-timer').textContent = '剩余 ' + remaining + ' 秒';
    eventTimerInterval = setInterval(function() {
      remaining--;
      document.getElementById('event-timer').textContent = '剩余 ' + remaining + ' 秒';
      if (remaining <= 0) {
        clearInterval(eventTimerInterval);
        var randomOpt = evt.options[Math.floor(Math.random() * evt.options.length)];
        chooseEventOption(randomOpt.text);
      }
    }, 1000);
  }

  async function chooseEventOption(optionText) {
    clearInterval(eventTimerInterval);
    document.getElementById('event-overlay').classList.add('hidden');
    try {
      var resp = await fetch(withKey('/api/event_choice'), {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({option: optionText})
      });
      var j = await resp.json();
      if (!j.ok) console.warn('事件选项提交失败:', j.error);
    } catch(e) { console.warn('事件选项提交异常:', e); }
  }

  // ====== TTS 语音朗读 ======
  document.getElementById('tts-enabled').addEventListener('change', function(e) {
    ttsEnabled = e.target.checked;
  });

  async function fetchTTS(text) {
    try {
      const resp = await fetch(withKey('/tts'), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: text })
      });
      if (!resp.ok) throw new Error('TTS请求失败');
      const blob = await resp.blob();
      const url = URL.createObjectURL(blob);
      audioPlayer.src = url;
      audioPlayer.play();
    } catch (e) {
      console.warn('TTS失败:', e);
    }
  }

  // ====== 自定义角色 ======
  var btnToggleRole = document.getElementById('btn-toggle-role');
  var roleEditor = document.getElementById('role-editor');
  var customRoleText = document.getElementById('custom-role-text');
  var btnSaveRole = document.getElementById('btn-save-role');
  var btnResetRole = document.getElementById('btn-reset-role');

  btnToggleRole.addEventListener('click', function() {
    roleEditor.classList.toggle('hidden');
  });

  async function loadCustomRole() {
    try {
      var resp = await fetch(withKey('/api/custom_role'));
      var j = await resp.json();
      if (j.ok && j.custom_system_prompt) {
        customRoleText.value = j.custom_system_prompt;
      }
    } catch(e) { console.warn('获取自定义角色失败:', e); }
  }

  btnSaveRole.addEventListener('click', async function() {
    var prompt = customRoleText.value.trim();
    try {
      var resp = await fetch(withKey('/api/custom_role'), {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({prompt: prompt})
      });
      var j = await resp.json();
      if (j.ok) {
        alert(prompt ? '自定义角色已保存，AI 将使用新设定' : '已恢复默认角色');
      } else {
        alert('保存失败: ' + (j.error || resp.status));
      }
    } catch(e) { console.warn('保存角色失败:', e); }
  });

  btnResetRole.addEventListener('click', function() {
    customRoleText.value = '';
    btnSaveRole.click();
  });

  // 初始化时尝试加载已有角色
  loadCustomRole();

  setInterval(async function () {
    try {
      var r = await fetch(withKey('/api/status'));
      var s = await r.json();
      srvStatus.textContent = s.serial_ok ? '在线' : '离线(无串口)';
      srvStatus.className = s.serial_ok ? 'ok' : 'bad';
      hrEl.textContent = s.hr ? (s.hr + ' bpm') : '-';
      fuseEl.textContent = s.fuse_reason || '-';
      cmdEl.textContent = s.last_command || '-';
      aiNarr.textContent = s.ai_reasoning || '(本轮无思考)';
      aiReply.textContent = s.ai_text || '(等待)';
      renderOpLog(s.op_log || []);

      // 检测事件
      if (s.active_event && s.active_event.id !== activeEventId) {
        showEvent(s.active_event);
      } else if (!s.active_event) {
        activeEventId = null;
        document.getElementById('event-overlay').classList.add('hidden');
      }

      // TTS：当AI回复更新且开启语音朗读时
      if (ttsEnabled && s.ai_text && s.ai_text !== lastAiText) {
        lastAiText = s.ai_text;
        fetchTTS(s.ai_text);
      }
    } catch (e) { srvStatus.textContent = '连接失败'; srvStatus.className = 'bad'; }
  }, 2000);
})();
</script>
</body>
</html>
