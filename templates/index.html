<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心率联动遥控 · 摄像头终端</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         background: #0f1115; color: #e8eaed; max-width: 760px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { color: #9aa0a6; font-size: 13px; margin-bottom: 16px; }
  .warn { background: #4a2c17; border: 1px solid #a4652a; color: #ffc46b;
          padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; }
  .hidden { display: none !important; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; }
  button { background: #1a73e8; color: #fff; border: 0; padding: 10px 16px; border-radius: 8px;
           font-size: 14px; cursor: pointer; }
  button:disabled { background: #3c4043; cursor: not-allowed; }
  button.gray { background: #3c4043; }
  label { font-size: 13px; color: #9aa0a6; }
  input[type=number] { width: 70px; padding: 6px; border-radius: 6px; border: 1px solid #5f6368;
                       background: #202124; color: #e8eaed; font-size: 14px; }
  video { width: 100%; border-radius: 12px; background: #000; margin-bottom: 12px; }
  .status { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 8px; font-size: 13px; margin-bottom: 12px; }
  .status div { background: #202124; border-radius: 8px; padding: 8px 10px; }
  .status b { display: block; margin-top: 2px; color: #fff; font-weight: 600; }
  .ok { color: #81c995; } .bad { color: #f28b82; }
  .ai-panel { background: #0b0e12; border: 1px solid #2a2f36; border-radius: 10px;
              padding: 12px; margin-bottom: 12px; }
  .ai-panel h3 { font-size: 14px; color: #9aa0a6; margin-bottom: 10px; }
  .narr { background: #13171d; border-left: 3px solid #2f81f7; border-radius: 6px;
          padding: 8px 10px; margin-bottom: 8px; }
  .narr-h { font-size: 12px; color: #7ab8e8; margin-bottom: 4px; font-weight: 600; }
  .narr pre { white-space: pre-wrap; word-break: break-word; font-size: 13px;
              font-family: ui-monospace, Consolas, monospace; color: #e8eaed; margin: 0; }
  .ai-log { max-height: 220px; overflow-y: auto; }
  .ai-log::-webkit-scrollbar { width: 6px; }
  .ai-log::-webkit-scrollbar-thumb { background: #3c4043; border-radius: 3px; }
  .op-empty { color: #9aa0a6; font-size: 13px; padding: 8px; }
  .op-item { display: flex; gap: 8px; align-items: baseline; padding: 6px 4px;
             border-bottom: 1px solid #1c2026; font-size: 12.5px; }
  .op-ts { color: #7a8087; font-family: ui-monospace, Consolas, monospace; flex-shrink: 0; }
  .op-ic { flex-shrink: 0; }
  .op-act { color: #e8eaed; font-weight: 600; flex-shrink: 0; }
  .op-det { color: #9aa0a6; word-break: break-word; }

  /* 事件弹窗样式 */
  #event-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.8);
    z-index: 999;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #event-panel {
    background: #202124;
    border-radius: 12px;
    padding: 20px;
    max-width: 500px;
    width: 90%;
    text-align: center;
  }
  #event-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; color: #fff; }
  #event-desc { font-size: 14px; color: #9aa0a6; margin-bottom: 8px; }
  #event-risk { font-size: 12px; color: #f28b82; margin-bottom: 16px; }
  #event-timer { font-size: 18px; font-weight: 700; color: #1a73e8; margin-bottom: 16px; }
  #event-options { display: flex; flex-direction: column; gap: 10px; }
  #event-options button {
    padding: 14px 20px;
    font-size: 16px;
    border-radius: 8px;
    background: #1a73e8;
    color: #fff;
    border: 0;
    cursor: pointer;
  }
  #event-options button:active {
    background: #1557b0;
  }

  /* 管理后台弹窗样式 */
  #admin-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.8);
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #admin-panel {
    background: #202124;
    border-radius: 12px;
    padding: 20px;
    max-width: 400px;
    width: 90%;
  }
  #admin-panel h3 { margin-bottom: 10px; font-size: 16px; }
  #admin-panel label { display: block; margin-bottom: 6px; }
  #admin-panel input[type=number] { width: 100%; padding: 6px; border-radius: 6px; border: 1px solid #5f6368;
    background: #0f1115; color: #e8eaed; font-size: 14px; margin-bottom: 8px; }
  #admin-panel button { margin-top: 6px; }
</style>
</head>
<body>
  <h1>📷 摄像头终端</h1>
  <div class="sub">每 3 秒拍照上传，AI 根据画面和心率输出控制指令</div>

  <div id="secure-hint" class="warn hidden">
    ⚠️ 当前为 http 非安全环境，浏览器禁止调用摄像头。请用 https 访问。
  </div>

  <div class="row">
    <button id="btn-start">启动摄像头</button>
    <button id="btn-stop" disabled>停止</button>
    <button id="btn-switch" class="gray">切换前后摄像头</button>
    <label>间隔(秒)<input id="interval" type="number" min="1" max="30" value="3"></label>
    <label><input type="checkbox" id="tts-enabled"> AI语音朗读</label>
    <label><input type="checkbox" id="ambient-enabled"> 氛围音效</label>
    <button id="btn-admin">⚙️ 管理后台</button>
  </div>

  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas" hidden></canvas>

  <div class="status">
    <div>上传状态 <b id="up-status">未开始</b></div>
    <div>上次上传 <b id="up-time">-</b></div>
    <div>服务器串口 <b id="srv-status">-</b></div>
    <div>心率 <b id="hr">-</b></div>
    <div>HRV(RMSSD) <b id="hrv">-</b></div>
    <div>静息基线 <b id="hrv-base">-</b></div>
    <div>熔断提示 <b id="fuse">-</b></div>
    <div>最后指令 <b id="cmd">-</b></div>
  </div>

  <!-- 手动控制面板 -->
  <div class="manual-panel" style="background:#202124;border-radius:8px;padding:10px;margin-bottom:12px;">
    <h3 style="font-size:14px;color:#9aa0a6;margin-bottom:8px;">🎛️ 手动控制</h3>
    <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;">
      <label>强度 <input type="range" id="manual-level" min="0" max="100" value="30"> <span id="manual-level-val">30</span></label>
      <label>时长(秒) <input type="range" id="manual-duration" min="1" max="60" value="10"> <span id="manual-duration-val">10</span></label>
      <label>波形
        <select id="manual-wave">
          <option value="constant">constant</option>
          <option value="sine">sine</option>
          <option value="pulse">pulse</option>
          <option value="random">random</option>
        </select>
      </label>
      <button id="btn-manual-set">发送 SET</button>
      <button id="btn-manual-stop">发送 STOP</button>
    </div>
  </div>

  <!-- 自定义角色面板 -->
  <div class="custom-role-panel" style="background:#202124;border-radius:8px;padding:10px;margin-bottom:12px;">
    <h3 style="font-size:14px;color:#9aa0a6;margin-bottom:8px;">🎭 自定义角色</h3>
    <button id="btn-toggle-role">编辑角色设定</button>
    <div id="role-editor" class="hidden" style="margin-top:8px;">
      <textarea id="custom-role-text" rows="6" style="width:100%;background:#0f1115;color:#e8eaed;border:1px solid #5f6368;border-radius:6px;padding:6px;" placeholder="在此粘贴你的 SYSTEM_PROMPT，留空并保存可恢复默认角色"></textarea>
      <div style="margin-top:6px;display:flex;gap:8px;">
        <button id="btn-save-role">保存角色</button>
        <button id="btn-reset-role">恢复默认</button>
      </div>
    </div>
  </div>

  <!-- 数据可视化面板 -->
  <div class="chart-panel" style="background:#202124;border-radius:8px;padding:10px;margin-bottom:12px;">
    <h3 style="font-size:14px;color:#9aa0a6;margin-bottom:8px;">📊 数据可视化</h3>
    <canvas id="hrChart" height="100"></canvas>
    <canvas id="cmdChart" height="80" style="margin-top:10px;"></canvas>
  </div>

  <div class="ai-panel">
    <h3>🤖 AI 叙述 与 操作日志</h3>
    <div class="narr"><div class="narr-h">🧠 AI 思考·叙述</div><pre id="ai-narr">(等待 AI 分析…)</pre></div>
    <div class="narr"><div class="narr-h">📖 AI 回复·剧情</div><pre id="ai-reply">-</pre></div>
    <div class="narr-h" style="margin:4px 0 6px;">🎮 操作日志</div>
    <div class="ai-log" id="op-log"><div class="op-empty">(等待 AI 开始运行，请点「启动摄像头」…)</div></div>
  </div>

  <!-- 事件弹窗 -->
  <div id="event-overlay" class="hidden">
    <div id="event-panel">
      <div id="event-title"></div>
      <div id="event-desc"></div>
      <div id="event-risk"></div>
      <div id="event-timer"></div>
      <div id="event-options"></div>
    </div>
  </div>

  <!-- 管理后台弹窗 -->
  <div id="admin-overlay" class="hidden">
    <div id="admin-panel">
      <h3>⚙️ 管理后台</h3>
      <label>熔断阈值 (心率) <input type="number" id="cfg-stop" value="130"></label>
      <label>限幅阈值 (心率) <input type="number" id="cfg-limit" value="110"></label>
      <label>限幅最大强度 <input type="number" id="cfg-limit-max" value="50"></label>
      <label>PC 强度上限 <input type="number" id="cfg-pc-cap" value="80"></label>
      <label>最大时长(秒) <input type="number" id="cfg-max-dur" value="300"></label>
      <hr style="border:none;border-top:1px solid #5f6368;margin:10px 0;">
      <div style="font-size:12px;color:#9aa0a6;margin-bottom:6px;">
        HRV（心率变异性）：0 = 用本会话自适应基线；填了数字则以你填的为准
      </div>
      <label>静息心率 (bpm，0=自适应) <input type="number" id="cfg-rest-hr" value="0" min="0" max="220"></label>
      <label>HRV 基线 RMSSD (ms，0=自适应) <input type="number" id="cfg-base-rmssd" value="0" min="0" max="500"></label>
      <label>HRV 限幅降幅 (%) <input type="number" id="cfg-hrv-limit-drop" value="40" min="10" max="90"></label>
      <label>HRV 熔断降幅 (%) <input type="number" id="cfg-hrv-stop-drop" value="60" min="20" max="95"></label>
      <label>心率超基线熔断 (+bpm) <input type="number" id="cfg-hr-stop-delta" value="65" min="20" max="180"></label>
      <label>心率超基线限幅 (+bpm) <input type="number" id="cfg-hr-limit-delta" value="45" min="10" max="150"></label>
      <label>HRV 窗口 (秒) <input type="number" id="cfg-hrv-window" value="120" min="15" max="600"></label>
      <div id="cfg-hrv-state" style="font-size:12px;color:#9aa0a6;margin:6px 0;"></div>
      <button id="btn-save-config">保存配置</button>
      <button id="btn-reset-hrv">重置 HRV 会话</button>
      <button id="btn-reload-events">重新加载事件池</button>
      <button id="btn-close-admin">关闭</button>
    </div>
  </div>

<script>
(function () {
  var video = document.getElementById('video');
  var canvas = document.getElementById('canvas');
  var intervalInput = document.getElementById('interval');
  var upStatus = document.getElementById('up-status');
  var upTime = document.getElementById('up-time');
  var srvStatus = document.getElementById('srv-status');
  var hrEl = document.getElementById('hr');
  var hrvEl = document.getElementById('hrv');
  var hrvBaseEl = document.getElementById('hrv-base');
  var fuseEl = document.getElementById('fuse');
  var cmdEl = document.getElementById('cmd');
  var aiNarr = document.getElementById('ai-narr');
  var aiReply = document.getElementById('ai-reply');
  var opLogEl = document.getElementById('op-log');
  var btnStart = document.getElementById('btn-start');
  var btnStop = document.getElementById('btn-stop');
  var btnSwitch = document.getElementById('btn-switch');

  var stream = null, facing = 'environment', timer = null, uploading = false;
  var lastOpKey = '';
  var iconMap = { image:'📷', cmd:'🎮', fuse:'⚠️', warn:'⚠️' };

  // ====== 音频相关变量 ======
  var audioContext = null;
  var analyser = null;
  var dataArray = null;
  var mediaRecorder = null;
  var recordedChunks = [];
  var lastVolume = 0;

  // ====== TTS 语音朗读变量 ======
  var ttsEnabled = false;
  var lastAiText = '';
  var audioPlayer = new Audio();
  var ttsBlobUrl = null;
  // blob URL 不回收会一直占内存（每轮朗读一个），播完即释放
  audioPlayer.addEventListener('ended', function () {
    if (ttsBlobUrl) { URL.revokeObjectURL(ttsBlobUrl); ttsBlobUrl = null; }
    audioPlayer.removeAttribute('src');
  });

  // ====== 认证 key 支持 ======
  var accessKey = new URLSearchParams(window.location.search).get('key') || '';

  function withKey(url) {
    if (!accessKey) return url;
    var separator = url.indexOf('?') !== -1 ? '&' : '?';
    return url + separator + 'key=' + encodeURIComponent(accessKey);
  }

  if (location.protocol !== 'https:' &&
      location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
    document.getElementById('secure-hint').classList.remove('hidden');
  }

  function setStatus(t) { upStatus.textContent = t; }
  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; });
  }
  function renderOpLog(list) {
    if (!list || !list.length) { return; }
    var key = list.map(function(o){ return o.ts + o.action; }).join('|');
    if (key === lastOpKey) { return; }
    lastOpKey = key;
    var h = '';
    for (var i = list.length - 1; i >= 0; i--) {
      var o = list[i];
      var icon = iconMap[o.evt] || '•';
      var ts = new Date(o.ts * 1000).toLocaleTimeString();
      h += '<div class="op-item"><span class="op-ts">' + ts + '</span><span class="op-ic">' + icon + '</span>'
         + '<span class="op-act">' + escapeHtml(o.action) + '</span><span class="op-det">' + escapeHtml(o.detail || '') + '</span></div>';
    }
    opLogEl.innerHTML = h;
  }

  // ====== 音频特征提取 ======
  function initAudioCapture(stream) {
    try {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioContext.createAnalyser();
      analyser.fftSize = 512;
      var source = audioContext.createMediaStreamSource(stream);
      source.connect(analyser);
      dataArray = new Uint8Array(analyser.frequencyBinCount);
    } catch (e) { console.warn('音频初始化失败:', e); }
  }

  function getAudioFeatures() {
    if (!analyser) return null;
    try {
      analyser.getByteTimeDomainData(dataArray);
      var sum = 0;
      for (var i = 0; i < dataArray.length; i++) {
        var val = (dataArray[i] - 128) / 128;
        sum += val * val;
      }
      var rms = Math.sqrt(sum / dataArray.length);
      var volume = Math.min(100, rms * 100);
      var zeroCrossings = 0;
      for (i = 1; i < dataArray.length; i++) {
        if ((dataArray[i] - 128) * (dataArray[i-1] - 128) < 0) zeroCrossings++;
      }
      var pitch = zeroCrossings / dataArray.length;
      return { volume: volume, pitch: pitch };
    } catch (e) { return null; }
  }

  function uploadAudioFeatures() {
    var features = getAudioFeatures();
    if (!features) return;
    var volumeChange = Math.abs(features.volume - lastVolume);
    lastVolume = features.volume;
    fetch(withKey('/upload_audio_features'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        volume: features.volume,
        pitch: features.pitch,
        volumeChange: volumeChange,
        timestamp: Date.now()
      })
    }).catch(function(e){ console.warn('音频特征上传失败:', e); });
  }

  // ====== 录音并上传 ======
  function startRecorder(stream) {
    try {
      mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
      mediaRecorder.ondataavailable = function(event) {
        if (event.data.size > 0) recordedChunks.push(event.data);
      };
      mediaRecorder.onstop = function() {
        if (recordedChunks.length === 0) return;
        var blob = new Blob(recordedChunks, { type: 'audio/webm' });
        recordedChunks = [];
        var fd = new FormData();
        fd.append('audio', blob, 'audio.webm');
        fetch(withKey('/upload_audio'), { method: 'POST', body: fd })
          .then(function(res){ return res.json(); })
          .then(function(data){
            if (data.text) console.log('[语音] 识别结果:', data.text);
          })
          .catch(function(e){ console.warn('音频上传失败:', e); });
      };
    } catch (e) { console.warn('录音初始化失败:', e); }
  }

  function recordAndUploadAudio() {
    if (!mediaRecorder || mediaRecorder.state === 'recording') return;
    recordedChunks = [];
    mediaRecorder.start();
    setTimeout(function(){
      if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
    }, 2000);
  }

  async function startCamera() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: true
      });
      video.srcObject = stream;
      await video.play();
      btnStart.disabled = true; btnStop.disabled = false;
      setStatus('摄像头已启动');

      initAudioCapture(stream);
      startRecorder(stream);

      scheduleUpload();
    } catch (e) {
      setStatus('摄像头错误: ' + e.message);
      alert('无法访问摄像头: ' + e.message + (location.protocol === 'http:' ? ' (请改用 https)' : ''));
    }
  }

  function stopCamera() {
    if (timer) { clearInterval(timer); timer = null; }
    if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
    video.srcObject = null;
    btnStart.disabled = false; btnStop.disabled = true;
    setStatus('已停止');
    if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
    if (audioContext) { audioContext.close(); audioContext = null; }
  }

  function intervalSeconds() {
    // 输入框的 min/max 只在表单校验时生效；这里必须自己钳制，
    // 否则填 -5 会让 setInterval(…, -5000) 被浏览器当作 0ms → 狂刷上传与录音请求。
    var n = Number(intervalInput.value);
    if (!isFinite(n) || n < 1) n = 1;
    if (n > 30) n = 30;
    intervalInput.value = n;
    return n;
  }

  function scheduleUpload() {
    if (timer) clearInterval(timer);
    timer = setInterval(function(){
      uploadOnce();
      uploadAudioFeatures();
      recordAndUploadAudio();
    }, intervalSeconds() * 1000);
  }

  function capture() {
    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;
    canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
    return new Promise(function (resolve) { canvas.toBlob(resolve, 'image/jpeg', 0.85); });
  }

  async function uploadOnce() {
    if (uploading) return;
    uploading = true;
    // 没有超时保护时，服务端一旦挂起，uploading 会永久为 true，此后所有帧被静默丢弃
    var ctrl = new AbortController();
    var guard = setTimeout(function () { ctrl.abort(); }, 15000);
    try {
      var blob = await capture();
      var fd = new FormData();
      fd.append('image', blob, 'frame.jpg');
      var resp = await fetch(withKey('/upload'), { method: 'POST', body: fd, signal: ctrl.signal });
      var j = await resp.json();
      upTime.textContent = new Date().toLocaleTimeString();
      setStatus(j.ok ? '已上传' : '上传失败: ' + (j.error || resp.status));
    } catch (e) {
      setStatus(e.name === 'AbortError' ? '上传超时（>15s）' : '上传错误: ' + e.message);
    }
    finally { clearTimeout(guard); uploading = false; }
  }

  btnStart.addEventListener('click', startCamera);
  btnStop.addEventListener('click', stopCamera);
  btnSwitch.addEventListener('click', function () {
    facing = (facing === 'environment') ? 'user' : 'environment';
    stopCamera();
    setTimeout(startCamera, 300);
  });
  intervalInput.addEventListener('change', function () { if (timer) scheduleUpload(); });

  // ====== 手动控制逻辑 ======
  var manualLevel = document.getElementById('manual-level');
  var manualDuration = document.getElementById('manual-duration');
  var manualWave = document.getElementById('manual-wave');
  var manualLevelVal = document.getElementById('manual-level-val');
  var manualDurationVal = document.getElementById('manual-duration-val');
  var btnManualSet = document.getElementById('btn-manual-set');
  var btnManualStop = document.getElementById('btn-manual-stop');

  manualLevel.addEventListener('input', function() { manualLevelVal.textContent = manualLevel.value; });
  manualDuration.addEventListener('input', function() { manualDurationVal.textContent = manualDuration.value; });
  btnManualSet.addEventListener('click', function() {
    var cmd = 'SET ' + manualLevel.value + ' ' + manualDuration.value + ' ' + manualWave.value;
    sendManualCommand(cmd);
  });
  btnManualStop.addEventListener('click', function() { sendManualCommand('STOP'); });

  async function sendManualCommand(cmd) {
    try {
      const resp = await fetch(withKey('/api/command'), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ cmd: cmd })
      });
      const j = await resp.json();
      if (j.ok) {
        console.log('手动命令已发送:', cmd);
      } else {
        alert('命令发送失败: ' + (j.error || resp.status));
      }
    } catch (e) {
      console.warn('手动命令异常:', e);
      alert('网络错误，命令发送失败');
    }
  }

  // ====== 事件弹窗逻辑 ======
  var eventTimerInterval = null;
  var eventTimeoutSeconds = 15;
  var activeEventId = null;

  function clearEventTimer() {
    if (eventTimerInterval) { clearInterval(eventTimerInterval); eventTimerInterval = null; }
  }

  function showEvent(evt) {
    // 必须先清掉上一个弹窗可能还在跑的倒计时，否则会出两个连锁 bug：
    //   ① 旧闭包归零时替**旧事件**提交一次随机选择；
    //   ② 旧闭包 clearInterval 清掉的是新弹窗的定时器 → 新弹窗倒计时冻结、永不超时。
    clearEventTimer();
    activeEventId = evt.id;
    var evtId = evt.id;
    var options = evt.options || [];
    document.getElementById('event-title').textContent = evt.title;
    document.getElementById('event-desc').textContent = evt.description;
    document.getElementById('event-risk').textContent = evt.risk_reward || '';
    var optsDiv = document.getElementById('event-options');
    optsDiv.innerHTML = '';
    options.forEach(function(opt) {
      var btn = document.createElement('button');
      btn.textContent = opt.text;
      btn.onclick = function() { chooseEventOption(opt.text, evtId); };
      optsDiv.appendChild(btn);
    });
    document.getElementById('event-overlay').classList.remove('hidden');

    if (!options.length) {
      // 事件池被改坏（无选项）时不要启动倒计时：否则每秒抛 TypeError 且弹窗永不关闭
      document.getElementById('event-timer').textContent = '该事件没有可选项，等待下一轮';
      console.warn('事件 ' + evtId + ' 缺少 options，已跳过自动选择');
      return;
    }

    var remaining = eventTimeoutSeconds;
    document.getElementById('event-timer').textContent = '剩余 ' + remaining + ' 秒';
    eventTimerInterval = setInterval(function() {
      // 双保险：弹窗已被新事件替换时，旧倒计时直接退场
      if (evtId !== activeEventId) { clearEventTimer(); return; }
      remaining--;
      document.getElementById('event-timer').textContent = '剩余 ' + remaining + ' 秒';
      if (remaining <= 0) {
        clearEventTimer();
        var randomOpt = options[Math.floor(Math.random() * options.length)];
        chooseEventOption(randomOpt.text, evtId);
      }
    }, 1000);
  }

  async function chooseEventOption(optionText, eventId) {
    clearEventTimer();
    var id = eventId || activeEventId;
    document.getElementById('event-overlay').classList.add('hidden');
    try {
      var resp = await fetch(withKey('/api/event_choice'), {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        // 带上事件 id：服务端据此丢弃「迟到/过期」的选择，避免把它记到下一个事件上
        body: JSON.stringify({option: optionText, event_id: id})
      });
      var j = await resp.json();
      if (!j.ok) console.warn('事件选项提交失败:', j.error);
    } catch(e) { console.warn('事件选项提交异常:', e); }
  }

  // ====== TTS 语音朗读 ======
  document.getElementById('tts-enabled').addEventListener('change', function(e) {
    ttsEnabled = e.target.checked;
  });

  async function fetchTTS(text) {
    try {
      const resp = await fetch(withKey('/tts'), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: text })
      });
      if (!resp.ok) throw new Error('TTS请求失败');
      const blob = await resp.blob();
      // 上一段音频的 blob URL 必须先撤销：否则每轮朗读都会永久泄漏一份
      if (ttsBlobUrl) { URL.revokeObjectURL(ttsBlobUrl); ttsBlobUrl = null; }
      ttsBlobUrl = URL.createObjectURL(blob);
      audioPlayer.src = ttsBlobUrl;
      audioPlayer.play().catch(function (e) { console.warn('TTS 播放失败（可能未交互或音色不可用）:', e); });
    } catch (e) {
      console.warn('TTS失败:', e);
    }
  }

  // ====== 自定义角色 ======
  var btnToggleRole = document.getElementById('btn-toggle-role');
  var roleEditor = document.getElementById('role-editor');
  var customRoleText = document.getElementById('custom-role-text');
  var btnSaveRole = document.getElementById('btn-save-role');
  var btnResetRole = document.getElementById('btn-reset-role');

  btnToggleRole.addEventListener('click', function() {
    roleEditor.classList.toggle('hidden');
  });

  async function loadCustomRole() {
    try {
      var resp = await fetch(withKey('/api/custom_role'));
      var j = await resp.json();
      if (j.ok && j.custom_system_prompt) {
        customRoleText.value = j.custom_system_prompt;
      }
    } catch(e) { console.warn('获取自定义角色失败:', e); }
  }

  btnSaveRole.addEventListener('click', async function() {
    var prompt = customRoleText.value.trim();
    try {
      var resp = await fetch(withKey('/api/custom_role'), {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({prompt: prompt})
      });
      var j = await resp.json();
      if (j.ok) {
        alert(prompt ? '自定义角色已保存，AI 将使用新设定' : '已恢复默认角色');
      } else {
        alert('保存失败: ' + (j.error || resp.status));
      }
    } catch(e) { console.warn('保存角色失败:', e); }
  });

  btnResetRole.addEventListener('click', function() {
    customRoleText.value = '';
    btnSaveRole.click();
  });

  // ====== 数据可视化 ======
  var hrChart = null;
  var cmdChart = null;

  function initCharts() {
    if (typeof Chart === 'undefined') return; // CDN 未加载时降级：图表不可用但不阻断其它逻辑
    var hrCtx = document.getElementById('hrChart').getContext('2d');
    var cmdCtx = document.getElementById('cmdChart').getContext('2d');
    hrChart = new Chart(hrCtx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [{
          label: '心率 (bpm)',
          data: [],
          borderColor: '#ff6b6b',
          backgroundColor: 'rgba(255,107,107,0.2)',
          fill: true,
          tension: 0.3
        }]
      },
      options: {
        responsive: true,
        animation: false,
        scales: {
          x: { display: false },
          y: { beginAtZero: true, max: 150 }
        }
      }
    });

    cmdChart = new Chart(cmdCtx, {
      type: 'bar',
      data: {
        labels: [],
        datasets: [{
          label: '指令强度',
          data: [],
          backgroundColor: '#4dabf7'
        }]
      },
      options: {
        responsive: true,
        animation: false,
        scales: {
          x: { display: false },
          y: { beginAtZero: true, max: 100 }
        }
      }
    });
  }

  function updateCharts(dataLog) {
    if (typeof Chart === 'undefined' || !hrChart || !cmdChart) return;
    var labels = [];
    var hrData = [];
    var cmdData = [];
    dataLog.forEach(function(d) {
      var time = new Date(d.ts * 1000).toLocaleTimeString();
      labels.push(time);
      hrData.push(d.hr || 0);
      var level = 0;
      if (d.command && d.command.indexOf('SET') === 0) {
        var parts = d.command.split(' ');
        if (parts.length >= 2) level = parseInt(parts[1]) || 0;
      }
      cmdData.push(level);
    });
    hrChart.data.labels = labels;
    hrChart.data.datasets[0].data = hrData;
    hrChart.update('none');
    cmdChart.data.labels = labels;
    cmdChart.data.datasets[0].data = cmdData;
    cmdChart.update('none');
  }

  // ====== DLC8 氛围音效系统 ======
  var ambientEnabled = false;
  var ambientOscillator = null;
  var ambientGain = null;
  var ambientNoiseSource = null;
  var ambientNoiseGain = null;
  var ambientCtx = null;

  document.getElementById('ambient-enabled').addEventListener('change', function(e) {
    ambientEnabled = e.target.checked;
    if (ambientEnabled) {
      startAmbient();
    } else {
      stopAmbient();
    }
  });

  function startAmbient() {
    if (ambientOscillator) return;
    try {
      // 必须把 ctx 存到外层变量：它是要被 close() 的资源（以前是局部变量，
      // 一旦 stopAmbient 拿不到引用，反复开关就会持续泄漏 AudioContext，
      // 浏览器上限约 6 个之后就再也建不出来，且异常被 catch 吞掉、只在控制台留一行警告）
      ambientCtx = new (window.AudioContext || window.webkitAudioContext)();
      var ctx = ambientCtx;
      ambientOscillator = ctx.createOscillator();
      ambientOscillator.type = 'sine';
      ambientOscillator.frequency.value = 220;
      ambientGain = ctx.createGain();
      ambientGain.gain.value = 0.0;
      ambientOscillator.connect(ambientGain);
      ambientGain.connect(ctx.destination);
      ambientOscillator.start();

      var bufferSize = 2 * ctx.sampleRate;
      var buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      var data = buffer.getChannelData(0);
      for (var i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }
      ambientNoiseSource = ctx.createBufferSource();
      ambientNoiseSource.buffer = buffer;
      ambientNoiseGain = ctx.createGain();
      ambientNoiseGain.gain.value = 0.0;
      ambientNoiseSource.connect(ambientNoiseGain);
      ambientNoiseGain.connect(ctx.destination);
      ambientNoiseSource.loop = true;
      ambientNoiseSource.start();
    } catch(e) { console.warn('氛围音效启动失败:', e); }
  }

  function stopAmbient() {
    try {
      if (ambientOscillator) { ambientOscillator.stop(); ambientOscillator = null; }
      if (ambientNoiseSource) { ambientNoiseSource.stop(); ambientNoiseSource = null; }
      if (ambientGain) { ambientGain.gain.value = 0; ambientGain = null; }
      if (ambientNoiseGain) { ambientNoiseGain.gain.value = 0; ambientNoiseGain = null; }
      if (ambientCtx) { ambientCtx.close(); ambientCtx = null; }
    } catch(e) {}
  }

  function updateAmbient(hr, lastCommand) {
    if (!ambientEnabled || !ambientOscillator || !ambientGain || !ambientCtx) return;
    var freq, vol, noiseVol;
    // hr=0 与 hr=null 同义（无数据）：以前 0 会落到「正常」档，和状态栏把 0 显示成「-」不一致
    if (hr === null || hr === undefined || hr === 0) {
      freq = 180; vol = 0.02; noiseVol = 0.005;
    } else if (hr > 130) {
      freq = 440; vol = 0.12; noiseVol = 0.08;
    } else if (hr >= 110) {
      freq = 300; vol = 0.07; noiseVol = 0.04;
    } else {
      freq = 200; vol = 0.03; noiseVol = 0.01;
    }
    if (lastCommand && lastCommand.indexOf('SET') === 0) {
      var parts = lastCommand.split(' ');
      if (parts.length >= 2) {
        var level = parseInt(parts[1]) || 0;
        vol += level * 0.001;
        noiseVol += level * 0.0005;
      }
    }
    try {
      // 用 setTargetAtTime 渐变代替瞬时赋值：避免档位切换时的爆音/拉链噪声
      var now = ambientCtx.currentTime;
      ambientOscillator.frequency.setTargetAtTime(freq, now, 0.5);
      ambientGain.gain.setTargetAtTime(vol, now, 0.3);
      if (ambientNoiseGain) ambientNoiseGain.gain.setTargetAtTime(noiseVol, now, 0.3);
    } catch(e) {}
  }

  // ====== DLC9 管理后台 ======
  var btnAdmin = document.getElementById('btn-admin');
  var adminOverlay = document.getElementById('admin-overlay');
  var btnCloseAdmin = document.getElementById('btn-close-admin');
  var btnSaveConfig = document.getElementById('btn-save-config');
  var btnReloadEvents = document.getElementById('btn-reload-events');

  btnAdmin.addEventListener('click', function() {
    adminOverlay.classList.remove('hidden');
    fetch(withKey('/api/config')).then(r=>r.json()).then(j=>{
      if (j.ok) {
        document.getElementById('cfg-stop').value = j.config.HR_STOP_ABOVE;
        document.getElementById('cfg-limit').value = j.config.HR_LIMIT_ABOVE;
        document.getElementById('cfg-limit-max').value = j.config.HR_LIMIT_MAX;
        document.getElementById('cfg-pc-cap').value = j.config.PC_LEVEL_CAP;
        document.getElementById('cfg-max-dur').value = j.config.MAX_DURATION_S;
        document.getElementById('cfg-rest-hr').value = j.config.RESTING_HR;
        document.getElementById('cfg-base-rmssd').value = j.config.BASELINE_RMSSD;
        document.getElementById('cfg-hrv-limit-drop').value = j.config.HRV_LIMIT_DROP_PCT;
        document.getElementById('cfg-hrv-stop-drop').value = j.config.HRV_STOP_DROP_PCT;
        document.getElementById('cfg-hr-stop-delta').value = j.config.HR_STOP_DELTA;
        document.getElementById('cfg-hr-limit-delta').value = j.config.HR_LIMIT_DELTA;
        document.getElementById('cfg-hrv-window').value = j.config.HRV_WINDOW_SEC;
        var act = (j.config.HRV_BASELINE_ACTIVE === null || j.config.HRV_BASELINE_ACTIVE === undefined)
          ? '未建立' : (Number(j.config.HRV_BASELINE_ACTIVE).toFixed(1) + ' ms');
        document.getElementById('cfg-hrv-state').textContent =
          '当前生效 HRV 基线：' + act + '（来源：' + (j.config.HRV_SOURCE || '无') + '）';
      }
    });
  });

  btnCloseAdmin.addEventListener('click', function() {
    adminOverlay.classList.add('hidden');
  });

  btnSaveConfig.addEventListener('click', async function() {
    var payload = {
      HR_STOP_ABOVE: parseInt(document.getElementById('cfg-stop').value),
      HR_LIMIT_ABOVE: parseInt(document.getElementById('cfg-limit').value),
      HR_LIMIT_MAX: parseInt(document.getElementById('cfg-limit-max').value),
      PC_LEVEL_CAP: parseInt(document.getElementById('cfg-pc-cap').value),
      MAX_DURATION_S: parseInt(document.getElementById('cfg-max-dur').value),
      RESTING_HR: parseInt(document.getElementById('cfg-rest-hr').value || 0),
      BASELINE_RMSSD: parseInt(document.getElementById('cfg-base-rmssd').value || 0),
      HRV_LIMIT_DROP_PCT: parseInt(document.getElementById('cfg-hrv-limit-drop').value),
      HRV_STOP_DROP_PCT: parseInt(document.getElementById('cfg-hrv-stop-drop').value),
      HR_STOP_DELTA: parseInt(document.getElementById('cfg-hr-stop-delta').value),
      HR_LIMIT_DELTA: parseInt(document.getElementById('cfg-hr-limit-delta').value),
      HRV_WINDOW_SEC: parseInt(document.getElementById('cfg-hrv-window').value)
    };
    try {
      const resp = await fetch(withKey('/api/config'), {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
      });
      const j = await resp.json();
      if (j.ok) alert('配置已保存（静息心率改动会同时重建 HRV 会话）');
    } catch(e) { console.warn(e); }
  });

  document.getElementById('btn-reset-hrv').addEventListener('click', async function() {
    try {
      const resp = await fetch(withKey('/api/config'), {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({reset_hrv: true})
      });
      const j = await resp.json();
      if (j.ok) alert('HRV 会话已重置，将重新采集静息基线');
    } catch(e) { console.warn(e); }
  });

  btnReloadEvents.addEventListener('click', async function() {
    try {
      const resp = await fetch(withKey('/api/config'), {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({reload_events: true})
      });
      const j = await resp.json();
      if (j.ok) alert('事件池已重新加载');
    } catch(e) { console.warn(e); }
  });

  // 初始化图表和角色加载（Chart.js 来自 CDN，失败时降级运行，不影响轮询/事件/手动控制）
  try { initCharts(); } catch (e) { console.warn('图表初始化失败(CDN不可达?)，降级运行', e); }
  loadCustomRole();

  setInterval(async function () {
    try {
      var r = await fetch(withKey('/api/status'));
      var s = await r.json();
      srvStatus.textContent = s.serial_ok ? '在线' : '离线(无串口)';
      srvStatus.className = s.serial_ok ? 'ok' : 'bad';
      hrEl.textContent = s.hr ? (s.hr + ' bpm') : '-';
      // HRV：显示当前 RMSSD 与相对基线的偏离
      if (s.hrv && s.hrv.rmssd) {
        var devTxt = (s.hrv_dev_pct === null || s.hrv_dev_pct === undefined)
          ? '基线采集中' : ((s.hrv_dev_pct > 0 ? '+' : '') + Number(s.hrv_dev_pct).toFixed(0) + '%');
        hrvEl.textContent = Number(s.hrv.rmssd).toFixed(1) + ' ms (' + devTxt + ')';
        hrvBaseEl.textContent = s.hrv.baseline_rmssd
          ? (Number(s.hrv.baseline_rmssd).toFixed(1) + ' ms / ' + (s.hrv.source || ''))
          : '未建立（等待采集）';
      } else {
        hrvEl.textContent = '-';
        hrvBaseEl.textContent = '-';
      }
      fuseEl.textContent = s.fuse_reason || '-';
      cmdEl.textContent = s.last_command || '-';
      aiNarr.textContent = s.ai_reasoning || '(本轮无思考)';
      aiReply.textContent = s.ai_text || '(等待)';
      renderOpLog(s.op_log || []);

      // 检测事件
      if (s.active_event && s.active_event.id !== activeEventId) {
        showEvent(s.active_event);
      } else if (!s.active_event) {
        activeEventId = null;
        document.getElementById('event-overlay').classList.add('hidden');
      }

      // TTS：当AI回复更新且开启语音朗读时
      if (ttsEnabled && s.ai_text && s.ai_text !== lastAiText) {
        lastAiText = s.ai_text;
        fetchTTS(s.ai_text);
      }

      // DLC7 更新图表
      if (s.data_log) {
        updateCharts(s.data_log);
      }

      // DLC8 更新氛围音效
      updateAmbient(s.hr, s.last_command);
    } catch (e) { srvStatus.textContent = '连接失败'; srvStatus.className = 'bad'; }
  }, 2000);
})();
</script>
