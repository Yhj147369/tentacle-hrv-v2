name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint with flake8
        run: |
          # 只检查严重错误（语法错误、未定义变量等）
          flake8 server.py setup.py --count --select=E9,F63,F7,F82 --show-source --statistics
          # 检查代码风格（不中断流程）
          flake8 server.py setup.py --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run logic tests (HRV / clamp / parse)
        run: |
          # tests/ 下是脚本式自检（自定义 check + 失败时非零退出码），不是 pytest 用例：
          # 必须用 python 直接运行。以前这里是 `pytest || true`，pytest 会收集到 0 个测试，
          # 这步永远绿色 —— HRV 安全层的回归全部逃过 CI。
          # test_api_once.py 需要真实 API Key、联网并产生费用，故不在 CI 中运行。
          # 注意：导入 server.py 会尝试加载 Vosk 中文模型；CI 上没有该模型时
          #       server.py 会打印「未找到 Vosk 模型」并继续，不影响被测试的逻辑。
          python tests/test_hrv_and_clamp.py
