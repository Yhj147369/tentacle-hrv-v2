# 自动化 CLA 门禁（双通道）：
# 1) cla-check（on pull_request_target）：PR 作者未签署（不在 .cla/signatures.json）→ 发引导评论并使检查失败，
#    从而被 main 分支保护（required status check: cla-check）拦截合并；作者已签署 → 直接通过。
# 2) auto-sign（on issue_comment）：PR 作者本人回复「我同意 CLA」（或 I agree 等）→ 机器人自动把作者写入
#    .cla/signatures.json 并推送 main，再把该 PR 的 cla-check 置为 success —— 全程无需维护者手动操作/rerun。
#
# 安全说明：
# - 两个 job 均运行仓库（默认分支/PR base 分支）中的代码，从不执行 PR 工作区代码；
# - auto-sign 只在「评论者 == PR 作者」且正文（去空白、大小写不敏感）精确匹配签署语时才写入名单，
#   外部用户无法替他人签署；已签署者重复回复会被幂等跳过。
name: CLA

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  cla-check:
    # issue_comment 事件下没有 pull_request 上下文，cla-check 仅在 PR 事件上运行
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base branch (含最新签名名单)
        uses: actions/checkout@v4
        with:
          # 显式按分支名检出，rerun 时解析为当时最新 base 内容
          ref: ${{ github.event.pull_request.base.ref }}

      - name: CLA check
        env:
          GH_TOKEN: ${{ github.token }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          echo "==> PR #$PR_NUMBER 作者：$PR_AUTHOR"

          if [ ! -f .cla/signatures.json ]; then
            echo "::error::仓库缺少 .cla/signatures.json，无法判定 CLA"
            exit 1
          fi

          # 1) 作者是否在签名名单中？
          SIGNED=$(jq -r --arg l "$PR_AUTHOR" '.signatures[]? | select(.login == $l) | .login' \
            .cla/signatures.json | head -n 1)
          if [ -n "$SIGNED" ]; then
            echo "==> ✅ 作者 $PR_AUTHOR 已在签名名单中，CLA 检查通过"
            exit 0
          fi

          echo "==> ❌ 作者 $PR_AUTHOR 未签署 CLA，本检查将失败"

          # 2) 幂等引导评论（自动版文案）：该 PR 已存在则不再重复发
          MARKER="请回复「我同意 CLA」"
          if gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq '.[].body' | grep -qF "$MARKER"; then
            echo "==> 该 PR 已有引导评论，跳过发帖"
          else
            COMMENT_FILE="$(mktemp)"
            {
              echo "感谢你的贡献！🤝"
              echo ""
              echo "检测到你的 GitHub 账号 **尚未签署 CLA（贡献者许可协议）**。本仓库已启用自动化门禁：**未签署的 PR 无法合并**。"
              echo ""
              echo "请在本 PR 回复「**我同意 CLA**」，即代表你已阅读并同意 [CLA.md](https://github.com/$GITHUB_REPOSITORY/blob/main/CLA.md)；"
              echo "机器人会自动将你加入签名名单并让本检查（cla-check）直接变绿，**全程无需维护者手动操作、无需 rerun**。"
              echo ""
              echo "签署流程详见 [CONTRIBUTING.md](https://github.com/$GITHUB_REPOSITORY/blob/main/CONTRIBUTING.md) 与 [CLA.md](https://github.com/$GITHUB_REPOSITORY/blob/main/CLA.md)。"
            } > "$COMMENT_FILE"
            gh pr comment "$PR_NUMBER" --body-file "$COMMENT_FILE"
            rm -f "$COMMENT_FILE"
            echo "==> 已发布引导评论"
          fi

          exit 1

  auto-sign:
    # 仅在 issue_comment 事件上运行
    if: github.event_name == 'issue_comment'
    runs-on: ubuntu-latest
    permissions:
      contents: write # 推送 .cla/signatures.json 到 main
      pull-requests: write # 置 cla-check 状态 + 发完成评论
    steps:
      - name: Checkout default branch (已受信代码)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.repository.default_branch }}

      - name: Validate & auto-sign
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/cla_autosign.py
